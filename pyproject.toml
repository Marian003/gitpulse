[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpulse"
version = "0.2.0"
description = "Beautiful terminal dashboard for GitHub profile stats"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.13.0",
    "rich>=13.9.0",
    "httpx>=0.28.1",
]

[project.scripts]
gitpulse = "gitpulse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gitpulse"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

keywords = ["github", "cli", "terminal", "dashboard", "stats"]


[project.urls]
Homepage = "https://github.com/Marian003/gitpulse"
Repository = "https://github.com/Marian003/gitpulse"


