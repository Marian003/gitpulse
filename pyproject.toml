[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# v1.0.0
name = "gitpulse"
version = "1.0.0"
description = "Beautiful terminal dashboard for GitHub profile stats"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
keywords = ["github", "cli", "terminal", "dashboard", "stats"]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.28.2",
]

[project.scripts]
gitpulse = "gitpulse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Marian003/gitpulse"
Repository = "https://github.com/Marian003/gitpulse"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpulse"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
